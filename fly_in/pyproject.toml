[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-in"
version = "0.1.0"
description = "Drone routing and scheduling simulation"
requires-python = ">=3.11"
dependencies = [
    "pygame==2.5.2",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "flake8==7.0.0",
    "mypy==1.9.0",
    "mypy-extensions==1.0.0",
]

[tool.setuptools.packages.find]
include = ["generator*"]