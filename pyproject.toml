[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation library (A-Maze-ing project)."
readme = "mazegen/DOC.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "srasolov" },
    { name = "maeandri" },
]

[tool.setuptools]
packages = ["mazegen"]
