[tool.poetry]
name = "matrix-loading"
version = "0.1.0"
description = "Matrix data analysis tool demonstrating pip vs Poetry dependency management"
authors = ["srasolov"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"